[project]
name = "security-depot-fsm-api"
version = "0.1.0"
description = "Mock FastAPI backend for the Security Depot field service management system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pymysql>=1.1.0",
    "pytest>=8.2.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
