api:
    listen: :1984
rtsp:
    listen: :8554
security_depot:
    fallback_recovery:
        check_interval: 10s
        enabled: true
        primary_stable_for: 20s
    onvif_discovery:
        enabled: true
        manufacturer: hikvision
        model: DS-7616NI
        name: Security Depot Gateway
    onvif_profile:
        channel_count: 16
        firmware: Security Depot
        manufacturer: hikvision
        model: DS-7616NI
        profile_family: hikvision-nvr
        profile_id: hikvision-generic-16
        sub_stream_offset: 16
streams:
